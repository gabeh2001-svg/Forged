<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--g1:#2f6bff;--g2:#4a4e69;--glass:rgba(255,255,255,.1);--edge:rgba(255,255,255,.2);--ink:#fff;--dim:rgba(255,255,255,.74);--G:#3ddc84;--A:#ffc53d;--R:#ff5c5c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 -apple-system,"SF Pro Display","Inter",system-ui,sans-serif;background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--g1) 26%,transparent),transparent 60%),radial-gradient(120% 70% at 100% 100%,color-mix(in srgb,var(--g2) 30%,transparent),transparent 60%),#080b13;background-attachment:fixed;-webkit-font-smoothing:antialiased}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@media(prefers-reduced-motion:reduce){body,.ring{animation:none}}
#app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:30px;letter-spacing:-.02em;margin:6px 2px 14px;font-weight:700}
h2{font-size:18px;margin:0 0 8px;font-weight:650;letter-spacing:-.01em}
small,.sm{color:var(--dim);font-size:13px}
.card{background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--edge);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 10px 40px rgba(20,0,60,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.hero{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
input,select,textarea{width:100%;background:rgba(255,255,255,.12);border:1px solid var(--edge);border-radius:14px;color:var(--ink);padding:12px 14px;font:inherit;margin:4px 0;outline:none}
input:focus,select:focus,textarea:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}

.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}.cd{display:flex;flex-direction:column;align-items:center;gap:2px}.cd b{display:flex;height:6px}.dd{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 1px}.dd.g{background:var(--G)}.dd.a{background:var(--A)}.dd.r{background:var(--R)}.cd.now{font-weight:800}
input[type=range]{padding:0;height:30px}
.grid{grid-auto-flow:dense}
.mn{display:none;position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(30,34,48,.9);border:1px solid var(--edge)}
.mn::after{content:"";position:absolute;left:7px;right:7px;top:11px;height:2px;border-radius:2px;background:#fff}
.edit .mn{display:block}
.num{font-size:46px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 6px}
#sc{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,9,18,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.scw{position:relative;width:min(66vw,260px);aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:1px solid var(--edge)}
.scw img{width:100%;height:100%;object-fit:cover}
.ln{position:absolute;left:0;right:0;height:3px;background:var(--g1);box-shadow:0 0 18px 6px var(--g1);animation:scan 1.3s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 3px)}}
</style></head>
<body><div id="app"></div><div id="ov"><div><div class="ringw"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="6"/><circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="70 220"/></svg><svg class="arm" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="armg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient></defs><path fill="url(#armg)" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M18 56 C26 48 44 48 54 56 L58 38 C56 34 57 22 64 20 C70 18 76 22 76 28 C76 33 73 36 70 37 L68 64 C68 70 64 73 58 73 L18 73"><animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.75;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="M18 56 C26 48 44 48 54 56 L58 38 C56 34 57 22 64 20 C70 18 76 22 76 28 C76 33 73 36 70 37 L68 64 C68 70 64 73 58 73 L18 73;M18 56 C24 37 47 35 54 56 L58 38 C56 34 57 22 64 20 C70 18 76 22 76 28 C76 33 73 36 70 37 L68 64 C68 70 64 73 58 73 L18 73;M18 56 C24 37 47 35 54 56 L58 38 C56 34 57 22 64 20 C70 18 76 22 76 28 C76 33 73 36 70 37 L68 64 C68 70 64 73 58 73 L18 73;M18 56 C26 48 44 48 54 56 L58 38 C56 34 57 22 64 20 C70 18 76 22 76 28 C76 33 73 36 70 37 L68 64 C68 70 64 73 58 73 L18 73"/></path><path d="M63 27 C66 25.5 70 25.5 73 27.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".7"/><path fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="30" stroke-dashoffset="30" d="M27 55 C32 52 37 53 42 51 C46 49.5 48 51 51 50"><animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.75;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="M27 55 C32 52 37 53 42 51 C46 49.5 48 51 51 50;M26 53 C31 46 37 47 42 44 C46 42 48 44 51 43;M26 53 C31 46 37 47 42 44 C46 42 48 44 51 43;M27 55 C32 52 37 53 42 51 C46 49.5 48 51 51 50"/><animate attributeName="stroke-dashoffset" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.75;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="30;0;0;30"/></path><path fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="8" stroke-dashoffset="8" d="M37 52.5 C38 54 40 55 42 55"><animate attributeName="d" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.75;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="M37 52.5 C38 54 40 55 42 55;M37 46 C38 48.5 40 50 42 50.5;M37 46 C38 48.5 40 50 42 50.5;M37 52.5 C38 54 40 55 42 55"/><animate attributeName="stroke-dashoffset" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;.75;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="8;0;0;8"/></path></svg></div><div id="q"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='forge.v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
Object.assign(S,{plans:S.plans||[],checks:S.checks||{},macros:S.macros||{},wins:S.wins||{},bg:S.bg||0,setup:S.setup||{}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const realToday=()=>iso(new Date());let VD=null;const today=()=>VD||realToday();
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const BG=[['#ff7a59','#7b4dff','#00c2ff'],['#11998e','#38ef7d','#0f4c81'],['#f093fb','#f5576c','#4facfe'],['#fc4a1a','#f7b733','#8e2de2'],['#0f2027','#2c5364','#7f5af0']];
const applyBg=()=>{const r=document.documentElement.style;r.setProperty('--g1',S.p||'#2f6bff');r.setProperty('--g2',S.s||'#4a4e69');const a=Number(S.gi??75),p=S.p||'#2f6bff',s=S.s||'#4a4e69';document.body.style.background=`radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,${p} ${a}%,transparent),transparent 60%),radial-gradient(120% 70% at 100% 100%,color-mix(in srgb,${s} ${Math.min(100,a+4)}%,transparent),transparent 60%),#080b13`;document.body.style.backgroundAttachment='fixed'};
let tab='home',ob=S.seenA2HS?'who':'a2hs',st=0,D=null,X={eq:'Bar',t:'Target Reps',bar:20},gx=false;
const SZ=['k','p','f','c'];

/* ---------- plate math ---------- */
function plates(w){const o=[];let r=w;for(const p of [25,20,15,10,5,2.5,1.25]){const n=Math.floor(r/p+1e-9);if(n){o.push(n+' × '+p);r-=n*p}}return o.join(' + ')}
function load(e){const w=+e.w;if(!w)return'';
 if(e.eq==='Bar'){const bar=+e.bar||20,side=(w-bar)/2;return side<0?'Total is below the bar weight':`Load ${side}kg to each side${side?' ('+plates(side)+')':''} on a ${bar}kg bar`}
 if(e.eq==='Free Weights')return `${w/2}kg in each hand`;return e.eq==='Body Weight'?`Add ${w}kg`:`Set the machine to ${w}kg`}
const tgt=e=>e.t==='Time Under Tension'?`${e.s} × ${e.v||'?'}s`:e.t==='Rep Range'?`${e.s} × ${e.v||'?'} reps`:`${e.s} × ${e.v||'?'} reps`;

/* ---------- RAG ---------- */
const RULES={k:(v,g)=>{const d=Math.abs(v-g);return d<=100?0:d<=250?1:2},
 p:(v,g)=>v>=g?0:g-v<=25?1:2,
 f:(v,g)=>{const o=v-g;return o<=5?0:o<=15?1:2},
 c:(v,g)=>{const d=Math.abs(v-g);return d<=15?0:d<=30?1:2}};
const LBL={k:['Calories','kcal'],p:['Protein','g'],f:['Fat','g'],c:['Carbs','g']};
function ragState(){const m=S.macros[today()]||{};return SZ.map(k=>{const v=m[k],g=S.setup[k];return(v===undefined||v===''||!g)?-1:RULES[k](+v,+g)})}
function activePlan(){return S.plans.find(p=>p.id===S.active)}
function evalDay(){const p=activePlan(),t=today();if(S.wins[t])return;
 if(S.done===t&&ragState().every(x=>x===0)){S.wins[t]=1;save();boom('day')}}

/* ---------- celebrations ---------- */
function boom(kind){if(!window.confetti)return;
 if(kind==='day')confetti({particleCount:160,spread:90,origin:{y:.65}});
 if(kind==='week'){let n=0;const t=setInterval(()=>{confetti({particleCount:50,startVelocity:35,spread:360,ticks:70,origin:{x:Math.random(),y:Math.random()*.5}});if(++n>9)clearInterval(t)},260)}
 if(kind==='month'){let n=0;const t=setInterval(()=>{confetti({particleCount:220,startVelocity:55,spread:360,scalar:1.4,origin:{x:Math.random(),y:Math.random()*.7}});if(++n>7)clearInterval(t)},300)}}
function periodic(){if(!S.setup.done)return;const t=new Date(),thr=+S.setup.thr||80;
 const mon=iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)));
 if(S.lastW&&S.lastW!==mon){let w=0;for(let i=0;i<7;i++)if(S.wins[addDays(S.lastW,i)])w++;if(w/7*100>=thr)setTimeout(()=>boom('week'),600)}
 S.lastW=mon;
 const ym=iso(t).slice(0,7);
 if(S.lastM&&S.lastM!==ym){const[y,m]=S.lastM.split('-').map(Number),dim=new Date(y,m,0).getDate();const w=Object.keys(S.wins).filter(k=>k.startsWith(S.lastM)).length;if(w/dim*100>=thr)setTimeout(()=>boom('month'),1200)}
 S.lastM=ym;save()}

/* ---------- views ---------- */
function onb(){
 if(!S.user){
  if(ob==='a2hs')return`<div class="card" style="margin-top:12vh"><h1>Forge</h1><p class="hero">Add this app to your Home Screen</p><p>Tap the Share icon in your browser, then choose <b>Add to Home Screen</b>. Forge saves everything on this device and works offline.</p><button class="btn big on" data-a="a2">Got it</button></div>`;
  return`<div class="card" style="margin-top:12vh"><h1>Who is using this app?</h1>${['Gabriel','Sarah','Jack Preston'].map(n=>`<button class="btn big" data-a="user" data-i="${n}">${n}</button>`).join('')}<p class="sm">This choice is permanent on this device.</p></div>`}
 const s=S.setup,steps=[
  `<h2>Your baseline</h2><p class="sm">Weight units</p><div class="chips">${['kg','lb'].map(u=>`<button class="chip ${(s.u||'kg')===u?'on':''}" data-a="unit" data-i="${u}">${u}</button>`).join('')}</div><div class="row"><label>Weight (${s.u||'kg'})<input type="number" data-b="setup.w" value="${esc(s.w)}"></label><label>Workouts per week<input type="number" min="1" max="7" data-b="setup.freq" value="${esc(s.freq)}"></label></div>`,
  `<h2>Daily macro goals</h2><div class="row"><label>Calories<input type="number" data-b="setup.k" value="${esc(s.k)}"></label><label>Protein (g)<input type="number" data-b="setup.p" value="${esc(s.p)}"></label></div><div class="row"><label>Fat (g)<input type="number" data-b="setup.f" value="${esc(s.f)}"></label><label>Carbs (g)<input type="number" data-b="setup.c" value="${esc(s.c)}"></label></div>`,
  `<h2>Reward threshold</h2><p>What percentage of days must you win to earn a weekly or monthly celebration?</p><label>Success rate (%)<input type="number" min="1" max="100" data-b="setup.thr" value="${esc(s.thr??80)}"></label><p class="sm">A winning day is all four macros green and your workout checked off.</p>`];
 return`<div class="card" style="margin-top:8vh"><small>Step ${st+1} of 3</small>${steps[st]}<button class="btn big on" data-a="st">${st<2?'Next':'Start forging'}</button></div>`}

function home(){
 const p=activePlan(),t=today(),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 let up='',list='';
 if(!p||!p.days.length){up=`<p class="hero">No plan yet</p><p>Build a workout in the Workout tab and it appears here.</p>`}
 else{const doneToday=S.done===t,idx=doneToday?p.cur:p.cur,d=p.days[idx];
  up=`<p class="hero">Coming up… ${esc(d.name)} - ${esc(d.body||'Full body')}</p><p>Don’t forget: ${esc(d.equip||'nothing special')}</p>`;
  if(doneToday)list=`<div class="card"><h2>Workout complete</h2><p class="sm">Rest up. Tomorrow starts with ${esc(d.name)}.</p></div>`;
  else{const ck=S.checks[t]=S.checks[t]||[];const all=d.ex.length&&d.ex.every((_,i)=>ck[i]);
   list=`<div class="card"><h2>Today’s workout</h2>${d.ex.map((e,i)=>`<div class="ck ${ck[i]?'done':''}" data-a="chk" data-i="${i}" role="checkbox" aria-checked="${!!ck[i]}" tabindex="0"><div class="box">${ck[i]?'✓':''}</div><div><div class="t"><b>${esc(e.n)}</b> ${tgt(e)}</div>${load(e)?`<span class="load">${esc(load(e))}</span>`:''}${e.o?`<div class="sm">${esc(e.o)}</div>`:''}</div></div>`).join('')||'<p class="sm">This day has no exercises.</p>'}${all?'<button class="btn big on" data-a="fin">Finish workout</button>':''}</div>`}}
 const m=S.macros[t]||{},rs=ragState();
 const ragCard=`<div class="card"><h2>Today’s macros</h2>${SZ.map((k,i)=>`<div class="rag"><div class="dot ${['g','a','r'][rs[i]]||''}"></div><div>${LBL[k][0]}<button class="glink" data-a="editgoal" data-i="${k}">goal ${S.setup[k]||'-'} ${LBL[k][1]}</button></div><input type="number" inputmode="decimal" placeholder="eaten" data-b="macro.${k}" data-r value="${esc(m[k])}"></div>`).join('')}<p class="sm">The Diet tab will take over detailed logging.</p></div>`;
 return`<h1>${g}, ${esc(S.user)}</h1><div class="sw">${BG.map((c,i)=>`<i data-a="bg" data-i="${i}" style="background:linear-gradient(135deg,${c[0]},${c[2]})" title="Background ${i+1}"></i>`).join('')}</div><div class="card">${up}</div>${list}${ragCard}${goalCard()}`}

function goalCard(){const g=S.goal||{},t=today();
 if(!g.set)return`<div class="card"><h2>Custom goal</h2><input placeholder="e.g. Hit 85kg" data-b="goal.text" value="${esc(g.text)}"><label>Deadline<input type="date" min="${t}" data-b="goal.due" value="${esc(g.due)}"></label><button class="btn" data-a="gset">Set goal</button></div>`;
 if(g.due<=t)return`<div class="card"><h2>${esc(g.text)}</h2><p class="hero">Did you achieve this?</p>${gx?`<p>Give yourself more time:</p><div class="row">${[['1 Week',7],['2 Weeks',14],['1 Month',30]].map(x=>`<button class="btn" data-a="ext" data-i="${x[1]}">${x[0]}</button>`).join('')}</div><label>Custom date<input type="date" min="${addDays(t,1)}" data-b="goal.cdue" value="${esc(g.cdue)}"></label><button class="btn" data-a="extc">Use custom date</button>`:`<div class="row"><button class="btn on" data-a="gy">Yes</button><button class="btn" data-a="gn">Not yet</button></div>`}</div>`;
 const n=Math.round((new Date(g.due)-new Date(t))/864e5);
 return`<div class="card"><h2>${esc(g.text)}</h2><p class="sm">${n} day${n===1?'':'s'} left (due ${esc(g.due)})</p><button class="btn" data-a="gclr">Clear goal</button></div>`}

function planner(){
 if(D)return builder();
 return`<h1>Workout plans</h1>${S.plans.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><span class="pill">${p.days.length} days</span> <span class="pill">${p.perWeek} per week</span> <span class="pill">${Math.ceil(p.days.length/p.perWeek)} weeks</span>${p.days.map(d=>`<p class="sm" style="margin:6px 0 0"><b>${esc(d.name)}</b>, ${esc(d.body||'no focus set')}: ${d.ex.length} exercises</p>`).join('')}<div class="row"><button class="btn ${S.active===p.id?'on':''}" data-a="use" data-i="${p.id}">${S.active===p.id?'Active':'Make active'}</button><button class="btn" data-a="delp" data-i="${p.id}">Delete</button></div></div>`).join('')||'<div class="card"><p>No plans yet. Build your first one.</p></div>'}<button class="btn big on" data-a="newp">New plan</button>`}

function resize(){const n=Math.max(1,Math.min(14,+D.total||1));while(D.days.length<n)D.days.push({name:'Day '+(D.days.length+1),body:'',equip:'',ex:[]});D.days.length=n;D.sel=Math.min(D.sel,n-1)}
function builder(){const d=D.days[D.sel];
 const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 return`<h1>${D.eid?'Edit plan':'New plan'}</h1><div class="card"><input placeholder="e.g. Yoga" data-b="D.name" value="${esc(D.name)}"><div class="row"><label>Total days<input type="number" min="1" max="14" data-b="D.total" data-r value="${D.total}"></label><label>Days per week<input type="number" min="1" max="7" data-b="D.perWeek" data-r value="${D.perWeek}"></label></div><p class="sm">Finishes in ${Math.ceil(D.total/(D.perWeek||1))} weeks.</p></div>
 <div class="chips">${D.days.map((x,i)=>`<button class="chip ${i===D.sel?'on':''}" data-a="sel" data-i="${i}">${esc(x.name)}</button>`).join('')}</div>
 <div class="card"><label>Day name<input data-b="day.name" data-r value="${esc(d.name)}"></label><label>Body part(s) trained<input data-b="day.body" value="${esc(d.body)}"></label><label>Need to bring anything to the gym for this day?<input data-b="day.equip" placeholder="e.g. yoga mat, towel" value="${esc(d.equip)}"></label></div>
 <div class="card"><h2>Exercises</h2>${d.ex.map((e,i)=>`<div class="sr"><div class="del" data-a="delx" data-i="${i}">Delete</div><div class="in ck" data-a="xedit" data-i="${i}" style="cursor:pointer"><div><b>${esc(e.n)}</b> ${tgt(e)}<div class="sm">${esc(e.eq)}${e.o?', '+esc(e.o):''}</div>${load(e)?`<span class="load">${esc(load(e))}</span>`:''}</div></div></div>`).join('')||'<p class="sm">None yet.</p>'}</div>
 <div class="card"><h2>Add exercise</h2><input placeholder="Exercise name (required)" data-b="X.n" value="${esc(X.n)}"><div class="row"><label>Target type<select data-b="X.t" data-r>${opt(['Target Reps','Rep Range','Time Under Tension'],X.t)}</select></label><label>Sets (required)<input type="number" min="1" data-b="X.s" value="${esc(X.s)}"></label></div><div class="row"><label>${X.t==='Rep Range'?'Range (e.g. 8-12)':X.t==='Time Under Tension'?'Seconds':'Reps'}<input data-b="X.v" value="${esc(X.v)}"></label><label>Total weight (kg)<input type="number" step="0.5" data-b="X.w" data-r value="${esc(X.w)}"></label></div><label>Equipment used<select data-b="X.eq" data-r>${opt(['Bar','Free Weights','Machine','Body Weight'],X.eq)}</select></label>${X.eq==='Bar'?`<label>Bar weight (kg)<input type="number" step="0.5" data-b="X.bar" data-r value="${esc(X.bar)}"></label>`:''}${load(X)?`<span class="load">${esc(load(X))}</span>`:''}<label>Additional notes<input placeholder="e.g. Bench at height 3" data-b="X.o" value="${esc(X.o)}"></label>${X.err?`<p class="err">${X.err}</p>`:''}<button class="btn" data-a="addx2">${X.ei!=null?'Update exercise':'Add to '+esc(d.name)}</button></div>
 ${D.err?`<p class="err">${D.err}</p>`:''}<button class="btn big on" data-a="conf2">Confirm plan?</button><button class="btn big" data-a="cancel">Cancel</button>`}

const soon=()=>`<h1>${tab==='diet'?'Diet tracker':'Timer and sets'}</h1><div class="card"><p class="hero">Arriving in the next build</p><p>${tab==='diet'?'Meal logging, body metrics and label scanning.':'Set tally, stopwatch and the millisecond rest timer.'}</p></div>`;
const nav=()=>`<nav class="nav">${[['home','🏠','Home'],['diet','🥗','Diet'],['plan','🏋️','Workout'],['timer','⏱️','Timer']].map(n=>`<button class="${tab===n[0]?'on':''}" data-a="tab" data-i="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`;

function render(){applyBg();const a=$('#app');
 if(!S.user||!S.setup.done)a.innerHTML=onb();
 else a.innerHTML=({home,diet:soon,plan:planner,timer:soon})[tab]()+nav()}

/* ---------- events ---------- */
const root=k=>({EST:()=>EST,GF:()=>GF,E:()=>E,W:()=>W,N:()=>N,M:()=>M,B:()=>(S.bm=S.bm||{})[today()]||(S.bm[today()]={}),S:()=>S,D:()=>D,X:()=>X,setup:()=>S.setup,macro:()=>S.macros[today()]||(S.macros[today()]={}),goal:()=>S.goal||(S.goal={}),day:()=>D.days[D.sel]})[k]();
function bind(el,final){const[r,k]=el.dataset.b.split('.');const o=root(r);o[k]=el.type==='number'?(el.value===''?'':+el.value):el.value;
 if(r==='D'&&k==='total'&&final)resize();
 save();if(final&&el.dataset.r!==undefined){render();if(r==='macro')evalDay()}}
document.addEventListener('input',e=>{if(e.target.dataset.b)bind(e.target,false)});
document.addEventListener('change',e=>{if(e.target.dataset.b)bind(e.target,true)});

let EST=null;
function hField(){const hu=S.setup.hu||'cm',h=+S.setup.h||0,ti=h?Math.round(h/2.54):0;
 return`<p class="sm" style="margin:12px 0 4px">Height</p><div class="chips" style="padding:0 0 6px">${[['cm','Centimetres'],['ft','Feet and inches']].map(x=>`<button class="chip ${hu===x[0]?'on':''}" data-a="hunit" data-i="${x[0]}">${x[1]}</button>`).join('')}</div>${hu==='cm'?`<label>Height (cm)<input type="number" inputmode="numeric" data-hcm value="${h?Math.round(h):''}"></label>`:`<div class="row"><label>Feet<input type="number" inputmode="numeric" data-hft value="${h?Math.floor(ti/12):''}"></label><label>Inches<input type="number" inputmode="numeric" data-hin value="${h?ti%12:''}"></label></div>`}`}
function hTxt(){const h=+S.setup.h;if(!h)return'not set';if((S.setup.hu||'cm')==='cm')return Math.round(h)+' cm';const ti=Math.round(h/2.54);return`${Math.floor(ti/12)} ft ${ti%12} in`}
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-hcm]')){S.setup.h=+el.value||0;save()}else if(el.matches('[data-hft],[data-hin]')){const b=el.closest('.card,.mwc')||document,ft=+(b.querySelector('[data-hft]')||{}).value||0,inch=+(b.querySelector('[data-hin]')||{}).value||0;S.setup.h=(ft||inch)?Math.round((ft*12+inch)*2.54*10)/10:0;save()}});
/* things every user must have; add new ones here and existing users are asked once */
const REQS=[{ok:()=>+S.setup.h>0,why:'height'}];
function reqShow(){let o=$('#req');const miss=S.user&&S.setup.done?REQS.filter(r=>!r.ok()):[];if(!miss.length){o&&o.remove();return}
 if(o)return;o=document.createElement('div');o.id='req';document.body.appendChild(o);
 o.innerHTML=`<div class="mwb"></div><div class="card mwc" role="dialog" aria-label="One more thing"><h2>One more thing</h2><p class="sm">Forged now uses your ${miss.map(r=>r.why).join(' and ')} to work out food estimates for you. Add it to carry on.</p><div id="hbox">${hField()}</div><p class="err" id="reqerr" hidden>Enter your height to carry on.</p><button class="btn big on" data-a="reqsave">Save and continue</button></div>`}
const ACT=[['Mostly sitting, little exercise',1.2],['Light: 1 to 3 workouts a week',1.375],['Moderate: 3 to 5 workouts a week',1.55],['Very active: 6 to 7 workouts a week',1.725],['Athlete or physical job plus training',1.9]];
function calcEst(E){const u=U(),wkg=u==='lb'?+E.w*0.4536:+E.w,h=+S.setup.h,age=+E.age;if(!(wkg>0&&h>0&&age>0&&E.sex))return null;
 const bmr=10*wkg+6.25*h-5*age+(E.sex==='Male'?5:-161),tdee=bmr*ACT[(+E.act||2)-1][1];let adj=E.goal==='lose'?-(+E.rate||.5)*1100:E.goal==='gain'?(+E.rate||.25)*1100:0;
 if(E.goal==='lose')adj=Math.max(adj,-tdee*.25);let k=Math.round((tdee+adj)/10)*10;const floor=E.sex==='Male'?1500:1200,floored=k<floor;if(floored)k=floor;
 const p=Math.round(wkg*(E.goal==='maintain'?1.6:E.goal==='lose'?2:1.8)),f=Math.max(Math.round(k*.27/9),Math.round(wkg*.6)),c=Math.max(0,Math.round((k-p*4-f*9)/4));
 return{bmr:Math.round(bmr),tdee:Math.round(tdee/10)*10,k,p,f,c,floored}}
function estForm(){const E=EST,u=U(),r=calcEst(E),opt=(a,v)=>a.map(x=>`<option value="${x[0]}" ${String(x[0])===String(v)?'selected':''}>${x[1]}</option>`).join(''),rl=x=>u==='lb'?`${r1(x/0.4536)} lb`:`${x} kg`;
 const rates=E.goal==='lose'?[.25,.5,.75]:[.25,.5];
 return`<h2>Work out my food goals</h2><p class="sm">A rough daily target from your weight, height, age and goal. It’s worked out on your phone using a standard formula.</p>
 <div class="row"><label>Weight (${u})<input type="number" step="0.1" data-b="EST.w" data-est value="${esc(E.w)}"></label><label>Age<input type="number" data-b="EST.age" data-est value="${esc(E.age)}"></label></div>
 <p class="sm" style="margin:8px 0 4px">Height: <b style="color:#fff">${hTxt()}</b>${+S.setup.h?'':' (add it below)'}</p>${+S.setup.h?'':`<div id="hbox">${hField()}</div>`}
 <p class="sm" style="margin:10px 0 4px">Sex (the formula differs slightly)</p><div class="chips" style="padding:0 0 4px">${['Male','Female'].map(x=>`<button class="chip ${E.sex===x?'on':''}" data-a="estset" data-k="sex" data-i="${x}">${x}</button>`).join('')}</div>
 <label>How active are you?<select data-b="EST.act" data-est>${opt(ACT.map((a,i)=>[i+1,a[0]]),E.act)}</select></label>
 <p class="sm" style="margin:10px 0 4px">Goal</p><div class="chips" style="padding:0 0 4px;flex-wrap:wrap">${[['lose','Lose weight'],['maintain','Maintain'],['gain','Gain / build']].map(x=>`<button class="chip ${E.goal===x[0]?'on':''}" data-a="estset" data-k="goal" data-i="${x[0]}">${x[1]}</button>`).join('')}</div>
 ${E.goal!=='maintain'?`<label>How fast?<select data-b="EST.rate" data-est>${opt(rates.map(x=>[x,`About ${rl(x)} a week${x===rates[rates.length-1]&&E.goal==='lose'?' (fastest)':x===.25?' (steady)':''}`]),E.rate)}</select></label>`:''}
 <div id="estres">${estRes(r)}</div><button class="btn big" data-a="shx">Cancel</button>`}
function estRes(r){if(!r)return`<p class="sm" style="margin-top:12px">Fill in your weight, height, age and sex to see your estimate.</p>`;
 return`<div class="est4"><div><b>${r.k}</b><span>kcal</span></div><div><b>${r.p}g</b><span>Protein</span></div><div><b>${r.f}g</b><span>Fat</span></div><div><b>${r.c}g</b><span>Carbs</span></div></div><p class="sm">Your body uses about ${r.tdee} kcal a day at this activity level.${r.floored?' This is the lowest daily target Forged will suggest, so aim for a slower pace or more activity instead.':''} This is an estimate (the Mifflin-St Jeor formula). Check your progress after 2 to 3 weeks and adjust.</p><button class="btn big on" data-a="estuse">Use these goals</button>`}
function estOpen(){const L=bmL(),g=S.goal2?S.goal2.type:'',f=+S.setup.freq||3;EST={w:L.w?L.w.v:(S.setup.w||''),age:S.setup.age||'',sex:S.setup.sex||'',act:S.setup.act||(f>=6?4:f>=3?3:2),goal:/Lose/.test(g)?'lose':/Gain/.test(g)?'gain':'maintain',rate:/Lose/.test(g)?.5:.25};sheet(estForm())}
document.addEventListener('input',e=>{if(EST&&(e.target.matches('[data-est]')||e.target.matches('[data-hcm],[data-hft],[data-hin]'))&&$('#estres')){S.setup.age=+EST.age||S.setup.age;$('#estres').innerHTML=estRes(calcEst(EST))}});
document.addEventListener('change',e=>{if(EST&&e.target.matches('select[data-est]'))$('#estres').innerHTML=estRes(calcEst(EST))});
function diet(){return diet15().replace('Totals reset every day. Edit them to adjust by hand.</p></div>','Totals reset every day. Tap a goal to change it.</p><button class="btn" data-a="estopen">Work out my goals for me</button></div>')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el){return}const a=el.dataset.a;
 if(a==='hunit'){S.setup.hu=el.dataset.i;save();document.querySelectorAll('#hbox').forEach(b=>b.innerHTML=hField());return}
 if(a==='reqsave'){if(REQS.every(r=>r.ok())){$('#req').remove();save();render();toast('Thanks, you’re all set.')}else{const er=$('#reqerr');er&&(er.hidden=false)}return}
 if(a==='estopen'){estOpen();return}
 if(a==='estset'){EST[el.dataset.k]=el.dataset.i;if(el.dataset.k==='goal')EST.rate=el.dataset.i==='lose'?.5:.25;sheet(estForm());return}
 if(a==='estuse'){const r=calcEst(EST);if(!r)return;Object.assign(S.setup,{k:r.k,p:r.p,f:r.f,c:r.c,age:+EST.age,sex:EST.sex,act:+EST.act});EST=null;sheet(null);save();render();toast('Goals updated.');return}
 if(a==='shx'&&EST)EST=null},true);
document.addEventListener('click',()=>setTimeout(reqShow,0));
render();periodic();reqShow();
</script></body></html>
